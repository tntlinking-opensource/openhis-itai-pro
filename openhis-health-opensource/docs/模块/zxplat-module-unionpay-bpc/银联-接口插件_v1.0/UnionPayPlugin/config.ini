[MAIN]
#系统名称1(主标题)(用于当前系统界面展示)
SystemName1=银联

#系统名称2(副标题)(用于当前系统界面展示)
SystemName2=接口插件

#系统启动延迟(秒)
AppRunLag=0

#监听地址,保持格式不变,可改为本机IP或127.0.0.1,端口随意不冲突即可
HttpServerUrl=http://127.0.0.1:19994/

#通讯接口编码(1:GB2312,2:GBK,3:UTF8,4:ANSI)
InterfaceCode=3

#传输方式(1:GET,2:POST(使用字符串类型json键值对格式,例:{"MSG":"***","INDATA":"***"}))
TransMode=1

※注意传参时的大小写



