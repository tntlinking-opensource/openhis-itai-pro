[APP00]
#应用类型中文名
APP_NAME=银行卡

#传入参数类型(消费|撤销|退货|查余|重打印|签到|结算|重打结算单)
INTER_TYPE=1|3|4|0|3|0|0|0

#应用对应文件夹路径
APP_PATH=bank

[APP01]
#应用类型名称
APP_NAME=有硬件POS通

#传入参数类型(消费|撤销|退货|结果查询|重打印|签到|结算|重打结算单)
INTER_TYPE=2|3|4|0|3|0|0|0

#应用对应文件夹路径
APP_PATH=pos

[APP02]
#应用类型名称
APP_NAME=无硬件POS通

#传入参数类型(B2C消费|B2C撤消|B2C退货||B2C结果查询|B2C签到|B2C结算)
INTER_TYPE=2|5|5||5|0|0

#应用对应文件夹路径
APP_PATH=nopos

####################################################################
#传入参数类型
#0：应用类型+交易类型
#1：应用类型+交易类型+金额
#2：应用类型+交易类型+金额+串码
#3：应用类型+交易类型+金额+凭证号
#4：应用类型+交易类型+金额+日期+参考号
#5：应用类型+交易类型+金额+银商订单号

[LOG]
#日志生成方式  0-全部生成在一个文件  1-按照日期生成在不同的文件
MODE=1

#日志保留时间  单位:天(日志生成方式为1时,此配置有效;配置为0永远保存)
validDate=0