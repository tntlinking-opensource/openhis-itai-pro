[TERMINF]
#------------------------------基本设置begin------------------------------#
#pos机程序版本  0--全民惠程序  1--银行卡
EMV_VER=0

#商户号
MCHT_ID=123456789900082

#终端号
TERM_ID=12345082

#商户号密文
SN=540871434FE7EFC7CB9B02DAA355C1AE0DA06156D09594C3AA1EA23F2F3E0E50

#串口号
PIN_COM=5

#TPDU
TPDU=6000300000
#------------------------------基本设置end--------------------------------#



#------------------------------商户参数设置begin--------------------------#
#商户中文名
MCHT_NAME=测试商户

#中文商户名/英文商户名
MCHT_E_NAME=
#------------------------------商户参数设置end----------------------------#



#------------------------------POS机设置begin------------------------------#
#应用类型
PACK_TYPE=1

#波特率  0-9600  1-115200
PIN_BAND=0

#奇偶校验模式  0-无校验  1-奇校验  2-偶校验
PIN_XOR=0

#串口通讯首次超时时间(秒)(最短60秒)
COMM_TIMEOUT_FIRST=120

#串口通讯其他超时时间(秒)(最短15秒)
COMM_TIMEOUT_OTHER=60
#------------------------------POS机设置end--------------------------------#



#------------------------------打印设置begin------------------------------#
#生成的打印文件名  默认不填写则生成在gmc目录,否则填写绝对路径(C:\\gmc\\receipt.txt),且需文件目录结构存在
giCARDPRT=

#打印模式  0-gmc打印  1-COMPOS机打印gmc模板  2-COMPOS机打印pos模板
gbComPos=0

#打印模式 0:不打印    1:用QuickRep1打印    2:并口打印    3:串口打印    5:可以配置打印机名字的USB打印
giPrintMode=0

#USB打印机名字
giPrinterName=

#打印端口
giPrintPort=1

#英文打印标志 0:不打印 1打印
PrntEnglishFlag=0

#是否套打 1：套打 0 ：不套打
giPrintFormat=0

#打印纸的左边距
giLeftMargin=0

#打印纸的长度
giReportLength=580

#打印字体大小
giFontSize=10

#打印纸每行的字节数，汉子占两个字节，10号字体每行最多只能显示26个字节
gilineLength=26

#两联之间的暂停时间，单位为秒
giPauseTime=5

#打印联数
PAPER=1

#打印抬头
CUST_NAME=测试商户

#撤销退货时金额前是否打印负号  0-不打印;1-打印
amountflag=0
#------------------------------打印设置end--------------------------------#



#------------------------------功能设置begin------------------------------#
#是否显示消息提示框 0--不显示  1--显示
showMsg=1

#交易完成后消息提示框显示时间(秒)
showTime=3

#日志级别(5-debug    4-hint    3-warn    2-error    1-fatal    0-always)
LOG_LEVEL=5

#十六进制日志级别(5-debug    4-hint    3-warn    2-error    1-fatal    0-always)
DLOG_LEVEL=5

#OCX调用模式 0-调用gmc.exe;1-调用bankall函数;2-调用bank函数
ocxbank=1

#是否处于签到状态1:签到2：签退
gbIssignon=1

#是否自动签到结算
autologin=0

#最近签到时间
LoginDate=A0A0A0A0

#最近结算时间
SettleDate=20110920

#是否触发TMS更新  0-不更新  1--更新
UpdataType=0

#电子签名上送开关 false-签名(打印)前上送，不发送58指令   true-签名(打印)后上送，发送58指令
Need58Cmd=false

#允许刷多张卡 0：只能刷一张卡  1：能刷多张卡
giMUCHCARD=0
#------------------------------功能设置end--------------------------------#



#------------------------------GMC设置begin-------------------------------#
#定义热键
ACTIVE_KEY=117

#1:独立运行程序 2：通过文件传递金额和交易类型。
giRunMode=1
giRunMode2=1

#检测程序焦点的时间间隔（秒）
giFOCUS=3

#当失去焦点时的操作，0-关闭程序，1-重新获取焦点, 2-不操作
giNOFOCUS=2

#关闭程序热键值
CLOSEKEY=113

#1-close  2-最小化  3-不做改变
giCloseMode=3

#当前操作员
gsaOper=01                                                  

#是否程序控制把焦点还收银程序程序 0-否 1-是
giSetCurrentWindowFocus=0

#界面字体颜色
BANK_Color=00000000

#是否向键盘POS发送复位指令  0-不发送;1-发送
gbPing=1

#是否允许做退货交易
CANREF=1

#最大允许退货金额(分)
RefundMaxAmt=2000001

#金额输入模式  0-类POS模式，不需输入小数点;1-旧版mis输入,需输入小数点
amountinput=0
#------------------------------GMC设置end---------------------------------#



#------------------------------前置机设置end------------------------------#
#全报文加密方式  1-xor;2-des;3-3des
keySN=2

#前置机版本
VER=0625

#是否有前置
NEEDHEAD=0

#前置类型  0-商户前置 1-集中前置
NetEncType=0
#------------------------------前置机设置end------------------------------#



#------------------------------其他设置end--------------------------------#
#是否向键盘POS发送复位指令  0-不发送;1-发送
gbPing=1

#是否下载明细  0-不更新tradelog;1-更新tradelog
get_tradelog=0

#结算前是否打印明细  0-不打印;1-打印
tradelogprint=0
#------------------------------其他设置end--------------------------------#

[TMS]
#IP
TMSIP=144.131.254.75

#PORT
TMSPORT=5555

#连接超时时间(秒)
TMSTIME=120

#是否强制联机报道 1-强制联机报道  0-pos终端触发联机报道
TMSFORCE=0
