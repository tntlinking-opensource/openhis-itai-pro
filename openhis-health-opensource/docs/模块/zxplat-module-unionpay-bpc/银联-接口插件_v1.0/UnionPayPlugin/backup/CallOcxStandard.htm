		for(var k in trans[defaultappTYPE]) {

			option.value = trans[defaultappTYPE][k];
			document.getElementById("trans").appendChild(option);
		}
	}

	 */

		var appTYPE = document.getElementById("appTYPE").value;
		var trans = document.getElementById("trans").value;
		var respCode = document.getElementById("respCode").value;

		if(appTYPE === '02' && trans === '10' && respCode === '00') {

			jQuery(function(){

			});
		}
	}

	/**
	 * 字符串转字节组
	 * 主要用于将中文字符转为字节
	 * @param str
	 * @returns arr
	 */
	function stringToByte(str) {
		var string = $GBK.encode(str);
		var byteArr = [];
		for(var i = 0; i < string.length; i++){
			var ch = string.charAt(i);
			if(ch === '%') {
				byteArr.push(string.slice(i + 1, i + 3));
				i += 2;
			} else {
				byteArr.push(ch);
			}
		}
		return byteArr;
	}

	/**
	 * 字节组转字符串
	 * 将解析出来的字节组按位截取后再转换为字符串显示在页面上
	 * @param arr
	 * @returns str
	 */
	function byteToString(arr) {
		var str = '';
		for(var i = 0; i < arr.length; i++) {
			if(arr[i].length > 1) {
				str += '%' + arr[i];
			} else {
				str += arr[i];
			}
		}
		return $GBK.decode(str);
	}

	/**
	 * 确认交易
	 * 确认交易按钮执行的操作
	 */
	function confirm() {
		/**
		 * 补齐长字段空格
		 * 请求参数
		 */
		DUmsocx1.bankrequest = "";
		for(var i in requestInformation) {
			if(document.getElementById(i).value.length > requestInformation[i].length) {
				alert(requestInformation[i].label + "输入内容有误，请检查输入内容！");
				return ;
			} else {
				while(document.getElementById(i).value.length < requestInformation[i].length) {
					document.getElementById(i).value += ' ';
				}
				DUmsocx1.bankrequest += document.getElementById(i).value;
			}
		}

		// 交易函数
		DUmsocx1.trans();

		/**
		 * 响应参数
		 * 如果有解析 gbk 编码的 js 文件，则解析响应参数，将其放在对应的位置
		 * 如果没有，直接弹出 alert 提示框
		 */
		if("undefined" !== typeof $GBK) {
			var response = stringToByte(DUmsocx1.BankResponse);
			for(var i in responseInformation) {
				document.getElementById(i).innerText = byteToString(response.splice(0, responseInformation[i].length));
			}
		} else {
			alert(DUmsocx1.BankResponse);
		}
	}
</script>
