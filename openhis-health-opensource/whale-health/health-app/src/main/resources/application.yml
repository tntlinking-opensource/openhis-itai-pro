spring:
  application:
    name: whale-health
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 仅开发库（本地 IDE）；现场不部署 health-app。培训/正式见 whale-project profile
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:whale}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2  # 优化：减少初始连接数，按需创建，加快启动速度
      connection-timeout: 10000  # 优化：减少连接超时时间（10秒）
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 1  # 优化：启动失败快速失败
      connection-test-query: SELECT 1  # 优化：连接测试查询
  
  jpa:
    hibernate:
      # 合并后 V1 未包含 adm_account/adm_practitioner 等表，用 update 让 Hibernate 自动建缺失表；待 DDL 补全到 Flyway 后可改回 validate
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # dialect 无需显式指定，Hibernate 会根据 JDBC 驱动自动检测 PostgreSQL
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    # 由 ModularFlywayConfiguration 按模块独立 history 表执行（见 openhis.flyway.modular）
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true  # 与 ModularFlywayConfiguration 一致：V99 已落地后仍可补跑 V26+
    schemas: public
    # 使用纯数字版本 V1..V6，满足 Flyway 11 文件名约定（避免 1_W1 等被判定为不符合约定）
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    validate-on-migrate: false  # 开发环境临时禁用校验和验证（修改迁移脚本后需要修复）
    clean-disabled: true
  
  # Quartz 自动配置
  quartz:
    job-store-type: jdbc  # 使用数据库持久化
    jdbc:
      initialize-schema: never  # 使用 Flyway 管理表结构，不自动初始化
    properties:
      org:
        quartz:
          scheduler:
            instanceName: WhaleScheduler
            instanceId: AUTO
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
          jobStore:
            # 只配置必要的属性，不设置 class 和 dataSource，让 Spring Boot 自动配置
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: WHALE_QRTZ_  # 使用 whale_qrtz_ 前缀的表
            isClustered: false
            useProperties: true
  
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
  servlet:
    context-path: /

# Whale Framework配置
app:
  version: @project.version@
  jwt:
    secret: ${JWT_SECRET:whale-health-secret-key-32-characters-long}
    access-token-expiration: 7200000  # 2小时，单位：毫秒
    refresh-token-expiration: 604800000  # 7天，单位：毫秒
    impersonation-access-token-expiration: 1800000  # 代理登录 30 分钟

  # 登录后会话（租户/医院/科室）：jdbc 持久化到库，重启仍有效；memory 仅内存
  session-store:
    type: jdbc
    cache:
      enabled: true
      expire-after-write-minutes: 2
      maximum-size: 5000
  
  cache:
    permission:
      expire-after-write: 5m
      maximum-size: 5000
    setting:
      expire-after-write: 10m
      maximum-size: 1000
    tenant:
      expire-after-write: 30m
      maximum-size: 100
    user:
      expire-after-write: 15m
      maximum-size: 2000
  
  rate-limit:
    enabled: false  # 是否启用限流（生产环境建议启用）
    max-requests-per-minute: 100  # 每分钟最大请求数

  logging:
    api-params-enabled: true  # 控制台打印 /api/app 请求体（whale.access）
    api-params-max-length: 2000  # 超长 JSON 截断，避免刷屏
  
  quartz:
    enabled: true

# 日志配置：启动阶段保留关键进度；运行期以访问摘要 + 异常/慢请求为主
logging:
  level:
    root: INFO
    whale.startup: INFO  # 启动里程碑：Flyway、缓存预热、端口就绪
    whale.access: INFO  # API 访问摘要：POST /api/app/xxx/yyy -> 200 125ms user=1 tenant=2
    com.openhis.whale: INFO
    com.openhis.health: INFO
    # --- 压制运行期噪音（不影响 WARN/ERROR）---
    com.openhis.whale.core.infrastructure.cache.IndexedCacheService: WARN
    com.openhis.whale.web.api.AppServiceControllerRegistrar: WARN
    com.openhis.whale.web.config.DynamicOpenApiCustomizer: WARN
    com.openhis.whale.web.config.OpenApiConfig: WARN
    com.openhis.whale.web.config.SwaggerDiagnosticInterceptor: WARN
    com.openhis.whale.identity.application.AuthAppService: WARN  # 登录流程细节不刷屏
    org.springframework.boot: INFO  # Starting / Started WhaleHealthApplication in X seconds
    org.springframework.jdbc: WARN
    org.springframework.orm: WARN
    org.springframework.data: WARN
    org.springframework.web: WARN
    org.springframework.web.servlet: WARN
    org.flywaydb: INFO  # 迁移脚本执行明细
    org.hibernate: WARN
    org.hibernate.orm.connections.pooling: ERROR
    org.hibernate.engine.jdbc.env.internal: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.quartz: WARN
    com.zaxxer.hikari: INFO  # 连接池 Starting / Start completed
    org.springdoc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  file:
    name: logs/whale-health.log
    max-size: 100MB
    max-history: 30

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /v3/api-docs/swagger-config
    try-it-out-enabled: true
    filter: true
    disable-swagger-default-url: true  # 禁用默认的 Petstore URL
  show-actuator: false
  use-management-port: false
openhis:
  framework:
    runtime:
      # 院端上报中心时使用；令牌通过环境变量注入，勿提交仓库
      sync-token: ${OPENHIS_FRAMEWORK_RUNTIME_SYNC_TOKEN:}
  bootstrap:
    # 开发/演示：启动时仅在必要时修复 admin；prod 关闭
    reset-admin-password:
      enabled: true
  flyway:
    modular:
      enabled: true
    dev-seed:
      enabled: true
      locations: classpath:db/migration/health-dev
  # 扩展模块运行时开关（health-app / whale-app 默认启用 emr + booking + campus）
  modules:
    emr:
      enabled: true
    mrms:
      enabled: true
    chs:
      enabled: true
    elep:
      enabled: true
    report:
      enabled: true
    booking:
      enabled: true
    campus:
      enabled: true
    peis:
      enabled: true
    einvoice-boss:
      enabled: true
    unionpay-bpc:
      enabled: true
    work-injury:
      enabled: true

  # CHS/ELEP 部署：embedded 同 JVM（-Pwith-chs/-Pwith-elep）；remote 分机（-Pwith-chs-remote/-Pwith-elep-remote + module-*-host）
  chs:
    deployment:
      mode: embedded          # embedded | remote
      remote:
        base-url: http://127.0.0.1:8091
        api-key: ${CHS_API_KEY:}
    inventory:
      upload-enabled: true
      # default-contract-bus-no: <fin_contract.bus_no>  # 多契约机构必填
  elep:
    deployment:
      mode: embedded          # embedded | remote
      remote:
        base-url: http://127.0.0.1:8080
        api-key: ${ELEP_API_KEY:}

whale:
  cache:
    concept:
      init-on-startup: true  # 生产环境可以设为 true，开发环境设为 false

# BJCA DSVS签名验证服务配置
ca:
  dsvs:
    enabled: true
    app-name: SVSDefault
    config-path: C:\BJCAROOT
  signature:
    # 验证模式: dsvs(BJCA官方SDK) / bc(BouncyCastle) / skip(跳过SM2验签，前端已验证)
    # SM2签名因服务端无法确定BJCA使用的ID，BC验证始终失败，DSVS需部署SVS服务
    # skip模式：前端SOF_VerifySignedData已做客户端签名验证，服务端跳过SM2验签
    verify-mode: skip

---
# 生产：关闭 Swagger
spring:
  config:
    activate:
      on-profile: prod
app:
  logging:
    api-params-enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
# 生产禁止跳过 CA 服务端验签（见 CaSignaturePolicyEnforcer）
ca:
  signature:
    verify-mode: dsvs
openhis:
  bootstrap:
    reset-admin-password:
      enabled: false
