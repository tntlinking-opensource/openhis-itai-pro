server:
  port: 8090

openhis:
  modules:
    chs:
      enabled: true
  chs:
    inventory:
      upload-enabled: true
      # default-contract-bus-no: H22010402403
      sale-also-inv-change3502: false
      max-retry: 5
      retry-backoff-seconds:
        - 60
        - 300
        - 900
      enforce-trace-count-equals-qty: true
      trace-required-default: true
      policy-exempt-catalog-types: []
      no-code-library-catalog-types: []
      retry-worker-enabled: true
      retry-worker-fixed-delay-ms: 60000
      retry-worker-batch-size: 50
    catalog:
      # ZIP 缓存根目录；每个版本一个文件：{根}/{tenantId}/{contractId}/{infno}/versions/{catalogVer}.zip
      download-cache-dir: ${CHS_CATALOG_ZIP_CACHE_DIR:${java.io.tmpdir}/chs-catalog-zip}
    deployment:
      # chs-server 独立进程：true；嵌入 health-app 时 false（默认）
      standalone: true
      remote:
        api-key: ${CHS_API_KEY:}

spring:
  application:
    name: chs-server

management:
  endpoints:
    web:
      exposure:
        include: health,info
