# 医保对接终端配置（OAuth、fixmedins、区划、密钥、URL 等均在此文件，不读 fin_contract 对应列）
# 配置段键 = fin_contract.bus_no（主数据表仅 bus_no 与 properties 对齐，其余列不参与 CHS）
# 热加载：修改本文件后自动生效（开发态监听 target/classes；生产建议外挂路径）：
#   -Dchs.contract.config.path=/path/to/chs-contract.properties
#   或环境变量 CHS_CONTRACT_CONFIG_PATH
# 配置键格式：contract.{医疗机构编码}-{参保区划码}.*
# 若主数据 bus_no 仅为区划后缀（如 229900），加载器会匹配以 -229900 结尾的键
#
# 吉林平台地址（长春市朝阳区中医院 H22010402403）：
#   base_url          网关根地址（与相对 path 拼接时的兜底）
#   token_url         OAuth Token
#   call_service_url  医保业务接口（1312/9001 等）
#   file_upload_url   9101/9102 文件上传下载
#   card_reader_*     读卡 DLL/服务（主机+端口）
#   ec_voucher_url    医保电子凭证（cfc.jlhs.gov.cn → 10.47.0.67:8089）
#   sign_mac          9001 签到 MAC（HeaSec GetClientID 完整 Base64；勿填过短占位值，否则服务端签到会报「解密Mac失败」）
#   sign_ip           9001 签到 IP
#   yb_plugin_url     OpenHIS.Win 读卡插件（02.Whale/openhis-win），默认 http://127.0.0.1:5000/api/data/

