# ZXPlat PACS Imaging · 中间件本地联调栈（序号 57）
#
# 启动：docker compose up -d
# 验收：见 README.md / 联调验收清单.md
#
# 端口（宿主机）：
#   Orthanc HTTP  8042  DICOM C-STORE 4242
#   OHIF          3000
#   MinIO API     9000  Console 9001

services:
  orthanc:
    image: jodogne/orthanc-plugins:1.12.6
    container_name: zxplat-orthanc
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/on-stable-study.lua:/etc/orthanc/on-stable-study.lua:ro
      - orthanc-storage:/var/lib/orthanc/db
    extra_hosts:
      # 供 Lua 回调宿主机 ZXPlat（Windows/Mac Docker Desktop）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ohif:
    image: ohif/app:v3.9.1
    container_name: zxplat-ohif
    ports:
      - "3000:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      - orthanc
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: zxplat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    container_name: zxplat-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/key-images || true;
      mc anonymous set none local/key-images;
      exit 0;
      "
    restart: "no"

volumes:
  orthanc-storage:
  minio-data:
