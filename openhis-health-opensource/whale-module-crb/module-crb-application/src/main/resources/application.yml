openhis:
  modules:
    crb:
      enabled: false
  crb:
    front-software:
      base-url: ""
      license: ""
      org-code: ""
      org-name: ""
    push:
      mock-enabled: true
      realtime-max-delay-seconds: 180
      max-retry: 5
      drain-interval-ms: 30000
      drain-tenant-id:
    lab:
      source: external
      outbox-poll-seconds: 60
      # Path B 入队租户（单租户场景必填；空则跳过 Outbox 消费）
      tenant-id:
      yunlis:
        jdbc-url: jdbc:mysql://127.0.0.1:3306/yunlis?serverTimezone=GMT%2B8&useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true
        username: yunlis
        password: yunlis
        # 默认关闭；院点联调前须 DBA 执行 参考/yunlis-crb_lab_outbox.sql 后再改 true
        enabled: false
    id:
      patient-pattern: "{orgCode}_{patientBusNo}"
      activity-versioned: false
